{% extends "celebs/base.html" %}
{% block content %}
<a href="{% url 'celebrity_detail' sighting.celebrity.id %}" class="back-button">Retour aux détails</a>
<div class="container">
  <h2>Modifier l'apparition de {{ sighting.celebrity.name }}</h2>

  <form method="POST">
    {% csrf_token %}
      <div class="form-group">
        <label for="id_date_seen">Date de rencontre</label>
        {{ form.date_seen }}
      </div>
      <div class="form-group">
        <label for="id_location">Lieu de rencontre</label>
        {{ form.location }}
      </div>
      <div class="form-group">
        <label for="id_notes">{{ form.notes.label }}</label>
        {{ form.notes }}
      </div>
    <button type="submit" class="btn">Enregistrer les modifications</button>
  </form>
</div>
{% endblock %}
