{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">

  <!-- Bouton pour afficher/masquer les filtres -->
    <button id="toggle-filters" class="btn" style="margin-bottom:1rem;">Afficher/Masquer les filtres</button>
    
    <!-- Formulaire de filtres caché par défaut -->
    <div id="filters-form" class="filter-form" style="display:none; margin-bottom:2rem;">
    
      <!-- Filtre catégories -->
      <div class="form-group">
        <label>Catégorie :</label>
        <select id="category-filter">
          <option value="">Toutes</option>
          {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
    
      <!-- Filtre multi-activités -->
      <div class="form-group">
        <label>Activités :</label>
        <div class="activity-checkbox-wrapper">
          {% for act in activities %}
            <button type="button" class="activity-toggle" data-id="{{ act.id }}" data-category="{{ act.category.id }}">
              {{ act.name }}
            </button>
          {% endfor %}
        </div>
        <div style="margin-top:10px;">
          <button type="button" id="clear-activities" class="btn">Clear</button>
          <button type="button" id="select-all-activities" class="btn">Select All</button>
        </div>
      </div>
    
    </div>
 

  <!-- Zone AJAX -->
  <div id="CelebListContainer">
    {% include "partials/celebrity_list_items.html" %}
  </div>
  <div id="PaginationContainer">
    {% include "partials/celebrity_pagination.html" %}
  </div>
</div>

<script src="{% static 'js/celebrity_filters.js' %}"></script>

<script>
  // Toggle affichage des filtres
  document.getElementById("toggle-filters").addEventListener("click", () => {
      const form = document.getElementById("filters-form");
      form.style.display = (form.style.display === "none") ? "block" : "none";
  });
</script>

{% endblock %}
